name: 部署网页版到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 需要仓库先在 Settings → Pages → Source 选「GitHub Actions」开启一次
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包网页文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
